<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Agentic OS avatar">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#22303e"/>
      <stop offset="1" stop-color="#11171e"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3b553"/>
      <stop offset="1" stop-color="#d98f2b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2531"/>
      <stop offset="1" stop-color="#0d1319"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#glow)"/>

  <!-- antenna sprout: the process tree growing out of its head -->
  <path d="M128 70V46M128 52c-8-10-20-14-30-12M128 52c8-10 20-14 30-12" stroke="#5b6b80" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="98" cy="40" r="9" fill="#4fa3e0"/>
  <circle cx="158" cy="40" r="9" fill="#55c08a"/>
  <circle cx="128" cy="34" r="13" fill="#e8a33d"/>
  <circle cx="123" cy="29" r="4" fill="#fff" opacity=".55"/>

  <!-- body -->
  <path d="M74 236c0-30 24-50 54-50s54 20 54 50z" fill="url(#shell)"/>
  <rect x="112" y="204" width="32" height="18" rx="6" fill="#0f151c"/>
  <circle cx="121" cy="213" r="3.5" fill="#55c08a"/>
  <circle cx="135" cy="213" r="3.5" fill="#4fa3e0"/>

  <!-- ears -->
  <rect x="44" y="110" width="20" height="44" rx="10" fill="#c27e22"/>
  <rect x="192" y="110" width="20" height="44" rx="10" fill="#c27e22"/>

  <!-- head -->
  <rect x="56" y="68" width="144" height="124" rx="44" fill="url(#shell)"/>
  <path d="M84 78h88" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".35"/>

  <!-- face screen -->
  <rect x="72" y="90" width="112" height="84" rx="30" fill="url(#screen)"/>

  <!-- eyes -->
  <ellipse cx="104" cy="128" rx="11" ry="13" fill="#7fd3d3"/>
  <ellipse cx="152" cy="128" rx="11" ry="13" fill="#7fd3d3"/>
  <circle cx="108" cy="123" r="4" fill="#fff"/>
  <circle cx="156" cy="123" r="4" fill="#fff"/>

  <!-- cheeks -->
  <ellipse cx="88" cy="151" rx="9" ry="5.5" fill="#ec6a64" opacity=".55"/>
  <ellipse cx="168" cy="151" rx="9" ry="5.5" fill="#ec6a64" opacity=".55"/>

  <!-- smile -->
  <path d="M118 150q10 9 20 0" stroke="#7fd3d3" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
