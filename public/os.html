<body>
<div class="os">
  <header id="top">
    <div class="wctl" id="wctlL"></div>
    <button class="tb-ic" data-act="toggleSidebar" data-tip="Sidebar · Ctrl+B"><svg class="i"><use href="#i-sidebar"/></svg></button>
    <div class="brand"><img src="/icon.svg" alt="">Agentic OS</div>
    <div class="crumbs" id="appTitle"></div>
    <div class="drag"></div>
    <button class="searchpill" data-act="palette"><svg class="i"><use href="#i-search"/></svg><span>Search or run a command…</span><kbd>Ctrl K</kbd></button>
    <div class="drag"></div>
    <span id="leadsBar" aria-label="Leads"></span>
    <span id="upd"></span>
    <span id="clock"></span>
    <span id="meters"></span>
    <button class="tb-ic" data-act="app" data-app="health" id="hbtn" data-tip="System health"><span class="dot" id="hdot"></span></button>
    <button class="tb-ic" id="askBtn" data-act="askOpen" data-tip="Ask the office · Ctrl+J"><svg class="i"><use href="#i-ask"/></svg></button>
    <button class="tb-ic" id="bell" data-act="ncenter" data-tip="Notifications"><svg class="i"><use href="#i-bell"/></svg><span class="nbadge" id="nbadge"></span></button>
    <button class="tb-ic" data-act="prefs" data-tip="Preferences · Ctrl+,"><svg class="i"><use href="#i-settings"/></svg></button>
    <button class="tb-ic" data-act="appmenu" data-tip="Main menu · F10"><svg class="i"><use href="#i-menu"/></svg></button>
    <div class="wctl" id="wctlR"></div>
  </header>
  <aside id="dock">
    <nav id="nav"></nav>
    <label id="quick" title="Type a job and press Enter"><span>$</span><input id="quickIn" placeholder="new job…" autocomplete="off"></label>
  </aside>
  <main id="main"><div id="alert"></div><div id="appRoot" style="position:absolute;inset:0"></div></main>
</div>
