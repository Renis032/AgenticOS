<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic OS</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #0e1319; --desk: #0b1015; --panel: #141b23; --panel2: #1a232d; --panel3: #212c38; --line: #26313e; --line2: #313e4d;
  --text: #e4eaf1; --muted: #8b97a6; --faint: #5d6977; --accent: #e8a33d; --accent-ink: #1a1206;
  --run: #4fa3e0; --deleg: #a585ec; --done: #55c08a; --fail: #ec6a64; --stop: #dcaa4a; --idle: #5fb3b3; --off: #6b7785; --queue: #8d96a3;
  --think: #b7b0f5; --code: #0f151c; --sel: #1f3348; --shadow: 0 12px 40px rgba(0,0,0,.45);
  --opus: #e08a5a; --sonnet: #6aa8ec; --haiku: #5cc59a;
  --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #eef1f5; --desk: #e4e8ee; --panel: #ffffff; --panel2: #f5f7fa; --panel3: #ebeff4; --line: #dfe4ea; --line2: #cfd6df;
    --text: #18212c; --muted: #5d6978; --faint: #8a95a3; --accent: #b86e1c; --accent-ink: #fff;
    --run: #2f7dc6; --deleg: #7a55d4; --done: #2c9a62; --fail: #d24545; --stop: #ad7c1c; --idle: #2a8f8f; --off: #8a939e; --queue: #7d8590;
    --think: #5b51b8; --code: #f3f5f8; --sel: #dbe9f8; --shadow: 0 12px 40px rgba(20,30,50,.18);
    --opus: #c0602f; --sonnet: #2f6fbf; --haiku: #23885c; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--desk); color: var(--text); font: 13.5px/1.45 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--run); cursor: pointer; text-decoration: none; }
code, pre, .mono { font-family: var(--mono); }
.os { display: grid; grid-template-columns: 208px 1fr; grid-template-rows: 38px 1fr; height: 100vh; }

#top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
#top .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .2px; cursor: pointer; white-space: nowrap; }
#top .brand img { width: 20px; height: 20px; }
#top .title { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top .sp { flex: 1; }
.meter { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; padding: 3px 8px; border-radius: 7px; white-space: nowrap; }
.meter:hover, .tbtn:hover { background: var(--panel2); }
.meter i { display: inline-block; width: 46px; height: 6px; border-radius: 4px; background: var(--panel3); overflow: hidden; }
.meter i b { display: block; height: 100%; }
.meter span { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
.tbtn { border: 0; background: none; padding: 4px 8px; border-radius: 7px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--queue); }
.dot.ok { background: var(--done); } .dot.warn { background: var(--stop); } .dot.bad { background: var(--fail); }
#clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; }

#dock { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#dock nav { flex: 1; overflow: auto; padding: 8px 6px; }
.app-link { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; color: var(--muted); }
.app-link:hover { background: var(--panel2); color: var(--text); }
.app-link.on { background: var(--sel); color: var(--text); font-weight: 600; }
.app-link .ic { width: 18px; text-align: center; font-family: var(--mono); }
.app-link .bd { margin-left: auto; font-size: 11px; font-weight: 700; border-radius: 9px; padding: 0 7px; background: var(--panel3); color: var(--text); }
.app-link .bd.run { background: var(--run); color: #fff; } .app-link .bd.ask { background: var(--stop); color: #1a1206; }
.dock-sec { font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--faint); padding: 10px 10px 4px; font-weight: 700; }
#quick { margin: 8px; display: flex; align-items: center; gap: 6px; background: var(--code); border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; font-family: var(--mono); }
#quick span { color: var(--accent); }
#quick input { border: 0; outline: 0; background: none; width: 100%; font-family: var(--mono); font-size: 12.5px; }

#main { position: relative; min-width: 0; min-height: 0; background: var(--bg); overflow: hidden; }
.app { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.toolbar h1 { font-size: 14px; margin: 0 8px 0 0; }
.toolbar .sp { flex: 1; }
.in, select, textarea { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; outline: none; }
.in:focus, select:focus, textarea:focus { border-color: var(--accent); }
select { -webkit-appearance: none; appearance: none; color: var(--text); padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
option { background: var(--panel); color: var(--text); }
textarea { width: 100%; resize: vertical; }
.btn { border: 1px solid var(--line2); background: var(--panel2); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel3); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--fail); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.hint { color: var(--muted); font-size: 12px; }
.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
.split { flex: 1; display: flex; min-height: 0; }
.scroll { overflow: auto; min-height: 0; }
.empty { color: var(--muted); padding: 40px; text-align: center; }

table.ps { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
table.ps td, table.ps th { overflow: hidden; text-overflow: ellipsis; }
table.ps th { position: sticky; top: 0; background: var(--panel2); text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; padding: 6px 10px; border-bottom: 1px solid var(--line); z-index: 1; white-space: nowrap; }
table.ps td { padding: 4px 10px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); white-space: nowrap; vertical-align: middle; }
table.ps tr { cursor: pointer; }
table.ps tbody tr:hover { background: var(--panel2); }
table.ps tr.on { background: var(--sel); }
table.ps tr.dim td { opacity: .55; }
.pid { font-family: var(--mono); color: var(--faint); text-align: right; }
.tree { font-family: var(--mono); color: var(--faint); white-space: pre; }
.tw { cursor: pointer; color: var(--muted); display: inline-block; width: 14px; text-align: center; font-family: var(--mono); }
.nm b { font-weight: 650; }
.nm .r { color: var(--muted); margin-left: 6px; }
.act { color: var(--muted); }
.act.th { color: var(--think); font-style: italic; }
.num { font-variant-numeric: tabular-nums; text-align: right; font-family: var(--mono); font-size: 12px; }
.mdl { font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--c, var(--muted)) 15%, transparent); color: var(--c, var(--muted)); white-space: nowrap; }
.m-opus { --c: var(--opus); } .m-sonnet { --c: var(--sonnet); } .m-haiku { --c: var(--haiku); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 1px 8px; border-radius: 99px; font-weight: 650; white-space: nowrap;
  background: color-mix(in srgb, var(--c, var(--muted)) 16%, transparent); color: var(--c, var(--muted)); }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.live::before { animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.s-running, .s-open { --c: var(--run); } .s-delegating { --c: var(--deleg); } .s-done { --c: var(--done); } .s-failed, .s-interrupted { --c: var(--fail); }
.s-stopped, .s-paused { --c: var(--stop); } .s-queued, .s-scheduled { --c: var(--queue); } .s-idle { --c: var(--idle); } .s-offline { --c: var(--off); }
.lv { font-size: 10.5px; font-weight: 700; color: #b8862a; }

.insp { width: 440px; flex: none; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.insp-head { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.insp-head h2 { margin: 0; font-size: 17px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.kv { display: flex; flex-wrap: wrap; gap: 3px 14px; color: var(--muted); font-size: 12px; margin-top: 6px; }
.kv b { color: var(--text); font-weight: 600; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
.tabs button { border: 0; background: none; padding: 8px 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--text); font-weight: 650; border-bottom-color: var(--accent); }
.body { flex: 1; overflow: auto; min-height: 0; padding: 4px 14px 14px; }
.composer { border-top: 1px solid var(--line); padding: 10px 12px; background: var(--panel); flex: none; }
.composer textarea { min-height: 46px; max-height: 200px; }
.row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.sec { padding: 10px 0; border-bottom: 1px solid var(--line); }
.label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.now { border-left: 3px solid var(--accent); padding: 3px 0 3px 10px; }
.bar { height: 5px; background: var(--panel3); border-radius: 5px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); }

.ev { margin: 8px 0; padding: 8px 10px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--line); }
.ev .h { font-size: 11px; color: var(--muted); display: flex; gap: 8px; text-transform: uppercase; letter-spacing: .5px; font-weight: 650; align-items: center; }
.ev .h .ts { margin-left: auto; font-weight: 400; text-transform: none; font-family: var(--mono); }
.ev .b { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
.ev .b.md { white-space: normal; }
.ev.thinking { background: transparent; border-style: dashed; }
.ev.thinking .b { color: var(--think); font-style: italic; }
.ev.answer, .ev.result { border-color: color-mix(in srgb, var(--done) 60%, var(--line)); }
.ev.err { border-color: var(--fail); }
.ev.user, .ev.reply { background: color-mix(in srgb, var(--accent) 10%, var(--panel2)); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); margin-left: 30px; }
.ev.question { border-color: var(--stop); background: color-mix(in srgb, var(--stop) 10%, var(--panel2)); }
.ev.plan, .ev.assign, .ev.team, .ev.report { border-left: 3px solid var(--deleg); }
.ev.chat { border-left: 3px solid #d6a92e; }
.ev.doc, .ev.memory { border-left: 3px solid var(--done); }
.line-ev { color: var(--muted); font-size: 12px; margin: 5px 2px; font-family: var(--mono); }
.md h4 { font-size: 13.5px; margin: 10px 0 4px; } .md p { margin: 4px 0; } .md ul { margin: 4px 0; padding-left: 20px; }
.md code, code { background: var(--code); padding: 0 4px; border-radius: 4px; font-size: 12px; }
pre { font-size: 12px; background: var(--code); padding: 8px 10px; border-radius: 7px; overflow: auto; max-height: 420px; white-space: pre-wrap; word-break: break-word; margin: 6px 0; border: 1px solid var(--line); }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 4px; }

.joblist { width: 330px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.jl { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.jl:hover { background: var(--panel2); }
.jl.on { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
.jl .t1 { display: flex; gap: 8px; align-items: baseline; }
.jl .n { color: var(--faint); font-family: var(--mono); font-size: 12px; }
.jl .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.jl .meta { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.jview { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.jhead { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.jhead h2 { margin: 0; font-size: 17px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.banner { margin: 10px 16px 0; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--stop); background: color-mix(in srgb, var(--stop) 10%, var(--panel)); }
.banner.plan { border-color: var(--deleg); background: color-mix(in srgb, var(--deleg) 9%, var(--panel)); }
.banner.fail { border-color: var(--fail); background: color-mix(in srgb, var(--fail) 9%, var(--panel)); }
.jbody { flex: 1; overflow: auto; padding: 6px 16px 16px; min-height: 0; }

.jtree { font-size: 12.5px; }
.jtree .nd { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 7px; cursor: pointer; }
.jtree .nd:hover { background: var(--panel2); }
.jtree .nd.hot { background: color-mix(in srgb, var(--run) 14%, transparent); }
.jtree .nd .why { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }

.diffhead { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.diffhead .p { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; direction: rtl; text-align: left; }
pre.diff { white-space: pre; }
pre.diff .a { color: var(--done); background: color-mix(in srgb, var(--done) 12%, transparent); display: block; }
pre.diff .d { color: var(--fail); background: color-mix(in srgb, var(--fail) 12%, transparent); display: block; }
pre.diff .hh { color: var(--deleg); display: block; }
.tl .r { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.tl .who { width: 110px; flex: none; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.tl .lane { position: relative; flex: 1; height: 16px; background: var(--panel3); border-radius: 4px; }
.tl .spn { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; background: var(--run); min-width: 3px; }
.tl .spn.res { background: var(--accent); } .tl .spn.bad { background: var(--fail); } .tl .spn.live { animation: blink 1.2s infinite; }
.tl .cursor { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); opacity: .7; }
.files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.file { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; font-size: 12px; background: var(--panel); max-width: 100%; }
.file img { width: 34px; height: 26px; object-fit: cover; border-radius: 4px; }
.file a { color: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .x { cursor: pointer; color: var(--muted); }
.drop { outline: 2px dashed var(--accent); outline-offset: -3px; }

.page { padding: 22px 26px; overflow: auto; flex: 1; min-height: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.card h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
.big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.wbar { height: 10px; border-radius: 6px; background: var(--panel3); overflow: hidden; margin: 6px 0; }
.wbar i { display: block; height: 100%; }
.chart { display: flex; align-items: flex-end; gap: 2px; height: 90px; }
.chart i { flex: 1; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 1px; }
.chart i.z { background: var(--line); }
.tkv { --k-r: #3987e5; --k-w: #d95926; --k-in: #199e70; --k-out: #c98500; }
@media (prefers-color-scheme: light) { .tkv { --k-r: #2a78d6; --k-w: #eb6834; --k-in: #1baf7a; --k-out: #eda100; } }
.tk-col.z { cursor: default; }
#tkF select { max-width: 190px; }
.tk-chart { display: flex; align-items: flex-end; gap: 2px; height: 170px; margin: 10px 0 4px; }
.tk-col { flex: 1; min-width: 6px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; cursor: pointer; }
.tk-col i { display: block; border-top: 2px solid var(--panel); }
.tk-col i:first-child { border-radius: 4px 4px 0 0; border-top: 0; }
.tk-col:hover i { filter: brightness(1.15); }
.tk-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.tk-legend span { display: inline-flex; align-items: center; gap: 5px; }
.tk-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tk-bar { display: inline-block; width: 110px; height: 8px; background: var(--panel3); border-radius: 4px; vertical-align: middle; margin-right: 6px; }
.tk-bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.tk-sess { height: 110px; } .tk-sess i { cursor: pointer; background: var(--run); min-width: 0; border-radius: 2px 2px 0 0; }
.tk-call { display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 12.5px; }
.tk-call:hover { background: var(--panel2); } .tk-call.on { background: var(--sel); }
.tk-detail { padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.tk-detail .card { margin: 0; } .tk-detail table.ps td { white-space: normal; }
.hbar { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12.5px; }
.hbar .n { width: 120px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .t { flex: 1; height: 10px; background: var(--panel3); border-radius: 4px; }
.hbar .t i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.hbar .v { width: 64px; text-align: right; font-family: var(--mono); font-size: 12px; }
.step { display: flex; gap: 8px; margin: 4px 0; } .step .i { width: 18px; flex: none; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.form .full { grid-column: 1 / -1; }
.rolerow { padding: 9px 0; border-bottom: 1px dashed var(--line); }
.rolerow .top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rolerow .top b { flex: 1; min-width: 140px; }

.two { display: flex; flex: 1; min-height: 0; }
.list { width: 280px; flex: none; border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
.li { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.li:hover { background: var(--panel2); } .li.on { background: var(--sel); }
.li .hint { margin-left: auto; }
.grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--faint); padding: 10px 12px 4px; font-weight: 700; }
.chatmsg { margin: 8px 0; padding: 8px 10px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); max-width: 760px; }
.chatmsg.me { background: color-mix(in srgb, var(--accent) 10%, var(--panel2)); margin-left: auto; }
.chatmsg .h { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; }
.chatmsg .h .ts { margin-left: auto; font-family: var(--mono); }

.term { flex: 1; overflow: auto; padding: 12px 16px; font-family: var(--mono); font-size: 12.5px; background: var(--code); white-space: pre-wrap; word-break: break-word; min-height: 0; }
.term .c { color: var(--accent); } .term .e { color: var(--fail); } .term .m { color: var(--muted); }
.termin { display: flex; gap: 8px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--line); background: var(--code); font-family: var(--mono); }
.termin span { color: var(--accent); }
.termin input { flex: 1; border: 0; outline: 0; background: none; font-family: var(--mono); }

#pal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 40; align-items: flex-start; justify-content: center; padding-top: 12vh; }
#pal.on { display: flex; }
#pal .box { width: min(600px, calc(100% - 24px)); max-height: 70vh; display: flex; flex-direction: column; overflow: hidden; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; box-shadow: var(--shadow); }
#pal input { border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; font-size: 16px; background: transparent; outline: none; }
#pal .items { overflow: auto; }
#pal .it { padding: 8px 16px; display: flex; gap: 10px; align-items: baseline; cursor: pointer; }
#pal .it.on, #pal .it:hover { background: var(--sel); }
#pal .it .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; width: 64px; flex: none; }
#pal .it .hint { margin-left: auto; }
kbd { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--panel2); }
#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 30; max-width: min(380px, calc(100% - 32px)); }
.toast { background: var(--panel); border: 1px solid var(--line2); border-radius: 11px; box-shadow: var(--shadow); padding: 10px 12px; cursor: pointer; animation: tin .2s ease-out; }
.toast b { display: block; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
#alert { display: none; align-items: center; gap: 10px; padding: 8px 14px; background: color-mix(in srgb, var(--stop) 16%, var(--panel)); border-bottom: 1px solid var(--stop); flex-wrap: wrap; }
#alert.on { display: flex; }
#tip { position: fixed; pointer-events: none; z-index: 50; padding: 5px 8px; font-size: 12px; border-radius: 7px; display: none; white-space: nowrap; background: var(--panel3); border: 1px solid var(--line2); }

@media (max-width: 1100px) { .insp { width: 360px; } .joblist { width: 270px; } }
@media (max-width: 860px) {
  .os { grid-template-columns: 52px 1fr; }
  .app-link span.lbl, .app-link .bd, .dock-sec, #quick { display: none; }
  .app-link { justify-content: center; padding: 9px 0; }
  .insp { position: absolute; right: 0; top: 0; bottom: 0; width: min(440px, 100%); box-shadow: var(--shadow); z-index: 5; }
  .insp.none { display: none; }
  .joblist { width: 100%; } .jobs.withjob .joblist { display: none; } .jobs:not(.withjob) .jview { display: none; }
  .list { width: 40%; }
  #top .title, .meter .lbl { display: none; }
  .act { display: none; }
}
</style>

<body>
<div class="os">
  <header id="top">
    <div class="brand" data-act="palette" title="Launcher (Ctrl+K)"><img src="/icon.svg" alt="">Agentic OS</div>
    <div class="title" id="appTitle"></div>
    <div class="sp"></div>
    <span id="meters"></span>
    <button class="tbtn" data-act="app" data-app="health" title="System health"><span class="dot" id="hdot"></span><span>Health</span></button>
    <button class="tbtn" id="bell" data-act="bell" title="Desktop notifications">🔕</button>
    <button class="tbtn" id="sound" data-act="sound" title="Sounds">🔈</button>
    <span id="clock"></span>
  </header>
  <aside id="dock">
    <nav id="nav"></nav>
    <label id="quick" title="Type a job and press Enter"><span>$</span><input id="quickIn" placeholder="new job…" autocomplete="off"></label>
  </aside>
  <main id="main"><div id="alert"></div><div id="appRoot" style="position:absolute;inset:0"></div></main>
</div>
<div id="pal"><div class="box"><input id="palIn" placeholder="Open an app, job, process, page or action…" autocomplete="off"><div class="items" id="palItems"></div></div></div>
<div id="toasts"></div>
<div id="tip"></div>
<input type="file" id="filePick" multiple hidden>
<script>
'use strict';
// ================================================================ helpers
const $ = (q, el = document) => el.querySelector(q);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = (x) => `$${(x || 0).toFixed(2)}`;
const clock = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const whenAt = (t) => new Date(t).toLocaleString([], { weekday: t - Date.now() > 20 * 3600000 ? 'short' : undefined, hour: '2-digit', minute: '2-digit' });
const ago = (t) => { const s = (Date.now() - t) / 1000; return s < 60 ? 'just now' : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : new Date(t).toLocaleDateString(); };
function dur(ms) { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor(s / 60) % 60}m`; }
const short = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const pct = (x) => `${Math.round((x || 0) * 100)}%`;
const pctFine = (x) => (x < 0.01 ? `${(x * 100).toFixed(1)}%` : `${Math.round(x * 100)}%`);
const tokens = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(Math.round(n || 0)));
const ACTIVE = ['running', 'delegating', 'queued'];
function md(src) {
  return String(src ?? '').split(/```[^\n]*\n?/).map((p, i) => {
    if (i % 2) return `<pre>${esc(p)}</pre>`;
    let h = esc(p).replace(/^#{1,4} (.*)$/gm, '<h4>$1</h4>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/^\s*[-*] (.*)$/gm, '<li>$1</li>');
    h = h.replace(/(<li>.*<\/li>\n?)+/g, (m) => `<ul>${m}</ul>`);
    return h.split(/\n{2,}/).map((x) => /^<(h4|ul|pre)/.test(x.trim()) ? x : `<p>${x.replace(/\n/g, '<br>')}</p>`).join('');
  }).join('');
}
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const pref = (k, d) => { try { const v = localStorage.getItem('aos.' + k); return v === null ? d : v; } catch { return d; } };
const setPref = (k, v) => { try { localStorage.setItem('aos.' + k, v); } catch {} };

// ================================================================ state
const S = {
  agents: {}, tickets: {}, roles: {}, residents: [], root: 'manager', projects: [], limits: null, health: null, selftest: null,
  app: pref('app', 'processes'), sel: null, job: null, jtab: 'thread', itab: 'mind', collapsed: new Set(), showIdle: pref('showIdle', '1') === '1',
  pq: '', pjob: '', jq: '', showArchived: false, events: {}, live: {}, newFiles: [], followFiles: [], chatTeam: null, libTeam: null, libPage: null,
  memAgent: null, term: { out: [], hist: [], hi: -1 }, timeline: {}, replay: null, spend: null, cfg: null, scripts: [], rerate: false,
};
const who = (id) => (id === 'user' ? 'You' : id === 'script' ? 'Office script' : id === 'system' ? 'System' : S.agents[id] ? S.agents[id].persona : id);
const leads = () => S.residents.filter((k) => k !== S.root);
const teamName = (k) => (S.roles[k] && S.roles[k].room) || k;
const modelChip = (a) => (a && a.model ? `<span class="mdl m-${esc(a.model)}">${esc(a.model)}/${esc(a.effort || '?')}</span>` : '<span class="hint">—</span>');
const stateLabel = (s) => ({ delegating: 'leading', idle: 'idle', offline: 'down', open: 'running', scheduled: 'scheduled', paused: 'paused' }[s] || s);
const pill = (s, extra) => `<span class="pill s-${esc(s)} ${['running', 'delegating', 'open'].includes(s) ? 'live' : ''}">${esc(extra || stateLabel(s))}</span>`;
const LEVELS = [1, 3, 6, 10, 15, 25, 40, 60];
const levelOf = (a) => 1 + LEVELS.filter((x) => (a.resident ? a.ticketsHandled || 0 : a.tasksDone || 0) >= x).length;
function starOf(homeId) {
  let best = null, bestRate = -1;
  for (const a of Object.values(S.agents)) {
    if (!a.staff || a.homeId !== homeId) continue;
    const tot = (a.tasksDone || 0) + (a.tasksFailed || 0);
    if (tot < 3) continue;
    const rate = (a.tasksDone || 0) / tot + tot / 1000;
    if (rate > bestRate) { bestRate = rate; best = a.id; }
  }
  return best;
}
function agentJob(a) {
  if (!a) return null;
  if (a.resident) return a.current ? S.tickets[a.current.ticketId] : null;
  return ACTIVE.includes(a.status) ? S.tickets[a.ticketId] : null;
}
function absorb(id, e) {
  const L = S.live[id] || (S.live[id] = {});
  const one = (t) => String(t || '').replace(/\s+/g, ' ').trim();
  if (e.kind === 'thinking' || e.kind === 'text') { L.thought = one(e.text); L.t = e.t; L.kind = 'think'; }
  else if (e.kind === 'progress') { L.thought = one(e.text); L.t = e.t; L.kind = 'say'; }
  else if (e.kind === 'delegate') { L.thought = 'Started: ' + one(e.text.replace(/\n/g, '; ')); L.t = e.t; L.kind = 'say'; }
  else if (e.kind === 'brief' || e.kind === 'followup') { L.thought = e.label || (e.chore ? 'Housekeeping.' : 'Reading the brief.'); L.t = e.t; L.kind = 'say'; }
  else if (e.kind === 'result') { L.thought = e.isError ? 'Finished with an error.' : 'Finished and reported.'; L.t = e.t; L.kind = 'say'; }
  else if (e.kind === 'msg_out') { L.thought = `→ ${e.toPersona}: ${one(e.text)}`; L.t = e.t; L.kind = 'say'; }
  else if (e.kind === 'script') { L.thought = `ran script ${e.name} ${(e.args || []).join(' ')}`; L.t = e.t; L.kind = 'say'; }
}

// ================================================================ boot + live updates
async function init() {
  const st = await api('GET', '/api/state');
  S.roles = st.roles; S.projects = st.projects; S.residents = st.residents; S.root = st.root; S.limits = st.limits;
  S.agents = Object.fromEntries(st.agents.map((a) => [a.id, a]));
  S.tickets = Object.fromEntries(st.tickets.map((t) => [t.id, t]));
  api('GET', '/api/scripts').then((l) => { S.scripts = l; }).catch(() => {});
  refreshHealth();
  setInterval(refreshHealth, 60000);
  await Promise.all(Object.values(S.agents).filter((a) => a.resident || ACTIVE.includes(a.status)).map((a) => loadEvents(a.id)));
  readHash();
  openApp(S.app, true);
  if (!/[?&]nosse/.test(location.search)) connect();
  setInterval(tick, 1000);
  tick();
}
async function loadEvents(id, force) {
  if (S.events[id] && !force) return;
  const list = await api('GET', `/api/agents/${id}/events?limit=400`).catch(() => []);
  S.events[id] = list;
  S.live[id] = {};
  for (const e of list) absorb(id, e);
}
function refreshHealth() { api('GET', '/api/health').then((h) => { S.health = h; if (!S.selftest) S.selftest = h.selftest; dirty(); }).catch(() => {}); }
let isDirty = true;
const dirty = () => { isDirty = true; };
function connect() {
  const es = new EventSource('/api/stream');
  es.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'agent') {
      const prev = S.agents[m.agent.id];
      S.agents[m.agent.id] = m.agent;
      if (!S.events[m.agent.id] && ACTIVE.includes(m.agent.status)) loadEvents(m.agent.id);
      if (prev && prev.memoryVersion !== m.agent.memoryVersion && S.app === 'memory') S.memCache = null;
    } else if (m.type === 'event') {
      absorb(m.agentId, m.event);
      if (S.events[m.agentId]) S.events[m.agentId].push(m.event);
    } else if (m.type === 'ticket') {
      const prev = S.tickets[m.ticket.id];
      S.tickets[m.ticket.id] = m.ticket;
      if (prev) for (const e of m.ticket.thread.slice(prev.thread.length)) {
        if (e.kind === 'answer' && !e.silent) notify('answer', `${who(e.from)} answered job #${m.ticket.n}`, e.text, m.ticket.id);
        else if (e.kind === 'system' && /budget/i.test(e.text || '') && m.ticket.overBudget) notify('warn', `Job #${m.ticket.n} paused at its budget`, e.text, m.ticket.id);
      }
      delete S.timeline[m.ticket.id];
    } else if (m.type === 'ticketRemoved') {
      delete S.tickets[m.id];
      if (S.job === m.id) S.job = null;
    } else if (m.type === 'limits') S.limits = m.limits;
    else if (m.type === 'notify') notify(m.kind, m.title, m.text, m.ticketId);
    else if (m.type === 'selftest') S.selftest = m.selftest;
    else if (m.type === 'roster') api('GET', '/api/state').then((st) => { S.roles = st.roles; S.residents = st.residents; S.projects = st.projects; for (const a of st.agents) S.agents[a.id] = a; S.cfg = null; dirty(); });
    else if (m.type === 'chat') S.chat = null;
    else if (m.type === 'docs') S.teams = null;
    else if (m.type === 'arms') { S.armsData = null; S.skillsData = null; S.routinesData = null; S.recosData = null; S.inbox = null; S.armsKey = null; }
    dirty();
  };
}
function tick() {
  $('#clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (S.replay && S.replay.playing) { S.replay.t = Math.min(S.replay.t1, S.replay.t + 1000 * S.replay.speed); if (S.replay.t >= S.replay.t1) S.replay.playing = false; isDirty = true; }
  if (!isDirty) return;
  isDirty = false;
  renderChrome();
  APPS[S.app].update();
}

// ================================================================ chrome: top bar, dock, alert
const APP_LIST = [
  { id: 'processes', ic: '▤', name: 'Processes', key: 'p', grp: 'System' },
  { id: 'jobs', ic: '☰', name: 'Jobs', key: 'j' },
  { id: 'newjob', ic: '+', name: 'New job', key: 'n' },
  { id: 'arms', ic: '◆', name: 'ARMS', key: 'a', grp: 'ARMS' },
  { id: 'skills', ic: '✦', name: 'Skills', key: 's' },
  { id: 'routines', ic: '↻', name: 'Routines', key: 'r' },
  { id: 'recos', ic: '☆', name: 'Recos', key: 'c' },
  { id: 'review', ic: '✓', name: 'Review', key: 'v', external: '/review' },
  { id: 'messages', ic: '✉', name: 'Messages', key: 'm', grp: 'Workspace' },
  { id: 'memory', ic: '◈', name: 'Memory', key: 'y' },
  { id: 'library', ic: '▦', name: 'Library', key: 'l' },
  { id: 'terminal', ic: '$', name: 'Terminal', key: 't' },
  { id: 'usage', ic: '◔', name: 'Usage', key: 'u' },
  { id: 'tokens', ic: '◧', name: 'Tokens', key: 'k' },
  { id: 'health', ic: '♥', name: 'Health', key: 'h' },
  { id: 'settings', ic: '⚙', name: 'Settings', key: ',' },
];
function windowOf(k) { return (S.limits && S.limits.windows && S.limits.windows[k]) || null; }
const live = (w) => (w.resetsAt && w.resetsAt < Date.now() ? 0 : w.utilization || 0);
const meterColor = (u) => (u >= 0.85 ? 'var(--fail)' : u >= 0.7 ? 'var(--stop)' : 'var(--done)');
function renderChrome() {
  const all = Object.values(S.agents);
  const running = all.filter((a) => ['running', 'delegating'].includes(a.status) || (a.resident && a.current)).length;
  const openJobs = Object.values(S.tickets).filter((t) => ['open', 'paused'].includes(t.status));
  const asks = Object.values(S.tickets).filter((t) => t.waiting || (t.plan && t.plan.status === 'pending')).length;
  const badges = { processes: running ? [running, 'run'] : null, jobs: asks ? [`${asks} ?`, 'ask'] : openJobs.length ? [openJobs.length, 'run'] : null };
  $('#nav').innerHTML = APP_LIST.map((x) => `${x.grp ? `<div class="dock-sec">${x.grp}</div>` : ''}<div class="app-link ${S.app === x.id ? 'on' : ''}" data-act="app" data-app="${x.id}" title="${esc(x.name)}"><span class="ic">${x.ic}</span><span class="lbl">${esc(x.name)}</span>${badges[x.id] ? `<span class="bd ${badges[x.id][1]}">${badges[x.id][0]}</span>` : ''}</div>`).join('');
  $('#meters').innerHTML = ['five_hour', 'seven_day'].map((k) => { const w = windowOf(k); if (!w) return ''; const u = live(w); return `<span class="meter" data-act="app" data-app="usage" title="${k === 'five_hour' ? '5-hour' : 'Weekly'} limit${w.resetsAt ? ', resets ' + whenAt(w.resetsAt) : ''}"><span class="lbl">${k === 'five_hour' ? '5h' : 'week'}</span><i><b style="width:${Math.min(100, u * 100)}%;background:${meterColor(u)}"></b></i><span>${pct(u)}</span></span>`; }).join('');
  $('#hdot').className = 'dot ' + (S.health ? S.health.level : '');
  $('#bell').textContent = pref('notify', '0') === '1' ? '🔔' : '🔕';
  $('#sound').textContent = pref('sound', '0') === '1' ? '🔊' : '🔈';
  $('#appTitle').textContent = '› ' + (APP_LIST.find((x) => x.id === S.app) || {}).name + `   ·   ${running} running · ${openJobs.length} open job${openJobs.length === 1 ? '' : 's'}`;
  const h = S.limits && S.limits.hold;
  const key = h ? `${h.window}|${h.resetsAt}` : '';
  const al = $('#alert');
  if (h && S.alertDismissed !== key) {
    al.classList.add('on'); al.dataset.key = key;
    al.innerHTML = `⚠️ <span>Your <b>${h.window === 'five_hour' ? '5-hour' : h.window === 'seven_day' ? 'weekly' : esc(h.window)}</b> limit is at <b>${pct(h.utilization)}</b>. New work is paused.</span><button class="btn pri sm" data-act="limContinue">Continue anyway</button><button class="btn sm" data-act="limWait">Wait for the reset (${whenAt(h.resetsAt)})</button>`;
    $('#appRoot').style.top = al.offsetHeight + 'px';
  } else { al.classList.remove('on'); $('#appRoot').style.top = '0'; }
}
function openApp(id, keepSel) {
  const ext = APP_LIST.find((x) => x.id === id && x.external);
  if (ext) { window.open(ext.external, 'agentos-' + id, 'popup,width=1280,height=860'); return; }
  if (!APPS[id]) id = 'processes';
  S.app = id;
  setPref('app', id);
  if (!keepSel && id !== 'processes') S.replay = null;
  $('#appRoot').innerHTML = '';
  APPS[id].mount($('#appRoot'));
  writeHash();
  renderChrome();
  APPS[id].update();
}
function writeHash() {
  const parts = [S.app];
  if (S.app === 'processes' && S.sel) parts.push('pid=' + S.sel);
  if (S.app === 'jobs' && S.job) parts.push('job=' + S.job, 'tab=' + S.jtab);
  history.replaceState(null, '', '#' + parts.join('&'));
}
function readHash() {
  const h = location.hash.slice(1);
  if (!h) return;
  const [app, ...kv] = h.split('&');
  if (APP_LIST.some((x) => x.id === app)) S.app = app;
  for (const x of kv) {
    const [k, v] = x.split('=');
    if (k === 'pid' && S.agents[v]) S.sel = v;
    if (k === 'job' && S.tickets[v]) S.job = v;
    if (k === 'tab') S.jtab = v;
    if (k === 'replay') S.wantReplay = true;
  }
}

// ================================================================ app: Processes (the full tree)
function parentOf(a) {
  if (a.id === S.root) return null;
  if (a.resident) return S.root;
  if (ACTIVE.includes(a.status) && a.parentId && S.agents[a.parentId]) return a.parentId;
  return S.agents[a.homeId] ? a.homeId : S.root;
}
function procTree() {
  const kids = {};
  for (const a of Object.values(S.agents)) { const p = parentOf(a); if (p) (kids[p] = kids[p] || []).push(a); }
  const order = (a) => (a.resident ? S.residents.indexOf(a.id) : 1000 + (ACTIVE.includes(a.status) ? 0 : 5000) + (a.no || 0));
  for (const k of Object.keys(kids)) kids[k].sort((x, y) => order(x) - order(y));
  return kids;
}
function procRows() {
  const kids = procTree();
  const q = S.pq.trim().toLowerCase();
  const jobIds = S.pjob ? new Set(Object.values(S.agents).filter((a) => (a.tickets || []).includes(S.pjob) || (S.tickets[S.pjob] && [S.tickets[S.pjob].direct, ...S.tickets[S.pjob].assignees].includes(a.id)) || (agentJob(a) || {}).id === S.pjob).map((a) => a.id)) : null;
  const keep = new Map();
  const visit = (a) => {
    const childKeep = (kids[a.id] || []).map(visit).some(Boolean);
    const busy = ACTIVE.includes(a.status) || (a.resident && a.current);
    let self = true;
    if (!S.showIdle && !a.resident && !busy) self = false;
    if (q && !(`${a.persona} ${a.name} ${a.role} ${a.no}`.toLowerCase().includes(q))) self = false;
    if (jobIds && !jobIds.has(a.id)) self = false;
    const k = self || childKeep || a.id === S.root || (a.resident && !q && !jobIds);
    keep.set(a.id, k);
    return self || childKeep;
  };
  const root = S.agents[S.root];
  if (!root) return [];
  visit(root);
  const rows = [];
  const walk = (a, prefix, last, depth) => {
    if (!keep.get(a.id)) return;
    const list = (kids[a.id] || []).filter((c) => keep.get(c.id));
    rows.push({ a, glyph: depth ? prefix + (last ? '└─ ' : '├─ ') : '', has: list.length, depth });
    if (S.collapsed.has(a.id)) return;
    list.forEach((c, i) => walk(c, depth ? prefix + (last ? '   ' : '│  ') : '', i === list.length - 1, depth + 1));
  };
  walk(root, '', true, 0);
  return rows;
}
function activityOf(a) {
  const L = S.live[a.id] || {};
  const busy = ACTIVE.includes(a.status) || (a.resident && a.current);

function ticketShare(usd) {

}

async function renderChanges(t, body) {
  const list = await api('GET', `/api/tickets/${t.id}/changes`).catch((e) => ({ error: e.message }));
  if (S.job !== t.id || S.jtab !== 'changes') return;
  if (list.error) { body.innerHTML = `<div class="empty">${esc(list.error)}</div>`; return; }
  if (!list.length) { body.innerHTML = '<div class="empty">No files changed on this job.</div>'; return; }
  const live = list.filter((c) => c.state !== 'unchanged').length;
  body.innerHTML = `<div class="row"><span class="hint" style="flex:1">${live} of ${list.length} file${list.length === 1 ? '' : 's'} differ from before this job. Undo restores the copy saved before the first edit here (it never touches git).</span>${live ? '<button class="btn sm danger" data-act="revert" data-path="">Undo all</button>' : ''}</div>` +
    list.map((c) => {
      const diff = esc(c.diff).split('\n').map((l) => (l.startsWith('@@') ? `<span class="hh">${l}</span>` : l.startsWith('+') && !l.startsWith('+++') ? `<span class="a">${l}</span>` : l.startsWith('-') && !l.startsWith('---') ? `<span class="d">${l}</span>` : l + '\n')).join('');
      return `<div class="diffhead">${pill(c.state === 'unchanged' ? 'queued' : c.state === 'deleted' ? 'failed' : 'done', c.state === 'unchanged' ? (c.revertedAt ? 'undone' : 'same') : c.state)}<span class="p" title="${esc(c.path)}"><bdi>${esc(c.path)}</bdi></span><span class="hint mono">+${c.added} −${c.removed}</span>${c.state !== 'unchanged' ? `<button class="btn sm" data-act="revert" data-path="${esc(c.path)}">Undo</button>` : ''}</div>
        <div class="hint">by ${esc(c.by.join(', '))}</div>${c.diff ? `<details ${list.length <= 3 ? 'open' : ''}><summary>diff</summary><pre class="diff">${diff}</pre></details>` : ''}`;
    }).join('');
}
async function renderTimeline(t, body) {
  const tl = await getTimeline(t);
  if (S.job !== t.id || S.jtab !== 'timeline' || !tl) return;
  if (!tl.rows.length) { body.innerHTML = '<div class="empty">Nobody has worked on this job yet.</div>'; return; }
  const t0 = tl.start, t1 = Math.max(tl.end || Date.now(), ...tl.rows.flatMap((r) => r.spans.map((sp) => sp.end || Date.now())));
  const span = Math.max(1000, t1 - t0);
  const x = (v) => Math.max(0, Math.min(100, ((v - t0) / span) * 100));
  if (S.wantReplay && !S.replay) { S.wantReplay = false; S.replay = { job: t.id, t: t0, t0, t1, speed: 30, playing: true }; }
  const R = S.replay && S.replay.job === t.id ? S.replay : null;
  const rows = tl.rows.sort((a, b) => (b.resident - a.resident) || (a.spans[0].start - b.spans[0].start));
  body.innerHTML = `<div class="row"><span class="hint" style="flex:1">${whenAt(t0)} → ${tl.end ? whenAt(tl.end) : 'now'} · ${dur(span)}</span>
      ${R ? `<button class="btn sm" data-act="rpPlay">${R.playing ? '⏸ Pause' : '▶ Play'}</button><select id="rpSpeed">${[10, 30, 120].map((v) => `<option value="${v}" ${R.speed === v ? 'selected' : ''}>${v}×</option>`).join('')}</select><button class="btn sm" data-act="rpExit">Exit replay</button>` : '<button class="btn sm" data-act="replay">▶ Replay</button>'}</div>
    ${R ? `<input type="range" id="rpSeek" min="0" max="1000" value="${Math.round(((R.t - t0) / span) * 1000)}" style="width:100%"><div class="hint mono">${new Date(R.t).toLocaleTimeString()} · +${dur(R.t - t0)}</div>` : ''}
    <div class="tl">${rows.map((r) => `<div class="r"><span class="who" data-act="sel2" data-id="${r.id}">${esc(r.persona)}</span><div class="lane">${r.spans.map((sp) => { const a = x(sp.start), b = x(sp.end || Date.now()); return `<i class="spn ${r.resident ? 'res' : ''} ${sp.ok === false ? 'bad' : ''} ${sp.running ? 'live' : ''}" style="left:${a}%;width:${Math.max(0.6, b - a)}%" data-tip="${esc(r.persona)} · ${dur((sp.end || Date.now()) - sp.start)} · ${sp.running ? 'working' : money(sp.costUsd)}"></i>`; }).join('')}${R ? `<i class="cursor" style="left:${x(R.t)}%"></i>` : ''}</div><span class="num" style="width:56px">${money(r.spans.reduce((s, sp) => s + sp.costUsd, 0))}</span></div>`).join('')}</div>
    ${R ? `<div class="label" style="margin-top:14px">Process tree at this moment</div>${jobTreeHtml(t, tl, R.t)}<div class="label" style="margin-top:14px">What had happened by then</div>${threadHtml(t, R.t)}` : `<div class="hint" style="margin-top:8px"><span style="color:var(--accent)">■</span> lead &nbsp; <span style="color:var(--run)">■</span> staff &nbsp; <span style="color:var(--fail)">■</span> did not finish. Replay steps through the job: the process tree and the thread as they were at each moment.</div>`}`;
  const seek = $('#rpSeek');
  if (seek) seek.oninput = (e) => { R.t = t0 + (span * Number(e.target.value)) / 1000; R.playing = false; S.jbodyKey = null; dirty(); };
  const sp = $('#rpSpeed');
  if (sp) sp.onchange = (e) => { R.speed = Number(e.target.value); };
}

// ================================================================ app: Terminal
APPS.terminal = {
  mount(root) {
    root.innerHTML = `<div class="app"><div class="toolbar"><h1>Terminal</h1><span class="hint">Office scripts and system commands. Type <code>help</code>.</span></div>
      <div class="term" id="termOut"></div><div class="termin"><span>agentos $</span><input id="termIn" autocomplete="off" spellcheck="false"></div></div>`;
    const inp = $('#termIn');
    inp.onkeydown = (e) => {
      const T = S.term;
      if (e.key === 'Enter') { const v = inp.value; inp.value = ''; T.hi = -1; if (v.trim()) { T.hist.push(v); termRun(v.trim()); } }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (T.hist.length) { T.hi = T.hi < 0 ? T.hist.length - 1 : Math.max(0, T.hi - 1); inp.value = T.hist[T.hi]; } }
      else if (e.key === 'ArrowDown') { e.preventDefault(); if (T.hi >= 0) { T.hi = Math.min(T.hist.length, T.hi + 1); inp.value = T.hist[T.hi] || ''; if (T.hi >= T.hist.length) T.hi = -1; } }
    };
    if (!S.term.out.length) termPrint('m', 'Agentic OS terminal. Commands: help · ps · jobs · open <pid|#job> · kill <pid> · new <job text> · clear · and every office script (e.g. count README.md).');
    termRender();
    setTimeout(() => inp.focus(), 0);
    $('#termOut').onclick = () => inp.focus();
  },
  update() {},
};
function termPrint(cls, text) { S.term.out.push({ cls, text }); if (S.term.out.length > 400) S.term.out.splice(0, 100); termRender(); }
function termRender() { const o = $('#termOut'); if (!o) return; o.innerHTML = S.term.out.map((l) => `<div class="${l.cls}">${esc(l.text)}</div>`).join(''); o.scrollTop = o.scrollHeight; }
function argv(s) { return (s.match(/"[^"]*"|'[^']*'|\S+/g) || []).map((w) => w.replace(/^(["'])(.*)\1$/, '$2')); }
async function termRun(line) {
  termPrint('c', '$ ' + line);
  const [cmd, ...args] = argv(line);
  const byPid = (x) => Object.values(S.agents).find((a) => String(a.no) === String(x) || a.persona.toLowerCase() === String(x).toLowerCase());
  if (cmd === 'clear') { S.term.out = []; return termRender(); }
  if (cmd === 'help') return termPrint('', ['ps                 process tree', 'jobs               open and recent jobs', 'open <pid|#n>      inspect a process or job', 'kill <pid>         stop a running process', 'new <text>         start a job', 'clear', '', 'Office scripts:', ...S.scripts.map((x) => `  ${x.usage.padEnd(58)} ${x.does}`)].join('\n'));
  if (cmd === 'ps') return termPrint('', procRows().map(({ a, glyph }) => `${String(a.no || '').padStart(4)}  ${(glyph + a.persona).padEnd(26)} ${`${a.model || '-'}/${a.effort || '-'}`.padEnd(14)} ${stateLabel(a.resident && a.current ? 'running' : a.status).padEnd(9)} ${(agentJob(a) ? '#' + agentJob(a).n : '-').padEnd(5)} ${money(a.costUsd)}`).join('\n'));
  if (cmd === 'jobs') return termPrint('', Object.values(S.tickets).filter((t) => !t.archived).sort((a, b) => b.createdAt - a.createdAt).slice(0, 20).map((t) => `#${String(t.n).padEnd(4)} ${stateLabel(t.status).padEnd(10)} ${money(t.costUsd).padStart(7)}  ${short(t.title, 70)}`).join('\n') || 'no jobs');
  if (cmd === 'open') { const x = args[0] || ''; if (x.startsWith('#')) { const t = Object.values(S.tickets).find((j) => '#' + j.n === x); if (t) { S.job = t.id; return openApp('jobs'); } } const a = byPid(x); if (a) { S.sel = a.id; return openApp('processes'); } return termPrint('e', 'not found: ' + x); }
  if (cmd === 'kill') { const a = byPid(args[0]); if (!a) return termPrint('e', 'no such process'); await api('POST', `/api/agents/${a.id}/stop`).catch((e) => termPrint('e', e.message)); return termPrint('m', `sent stop to ${a.persona} (${a.no})`); }
  if (cmd === 'new') { const text = args.join(' '); if (!text) return termPrint('e', 'usage: new <job text>'); const r = await api('POST', '/api/tasks', { text }).catch((e) => termPrint('e', e.message)); if (r) termPrint('m', `job started (${r.id}); open it in Jobs.`); return; }
  if (S.scripts.some((x) => x.name === cmd)) {
    const r = await api('POST', '/api/script', { name: cmd, args }).catch((e) => ({ error: e.message }));
    return termPrint(r.error ? 'e' : '', r.error || r.message);
  }
  termPrint('e', `unknown command: ${cmd} (try help)`);
}

async function addFiles(list, getTarget, done) { for (const f of list) { try { getTarget().push((await uploadFile(f)).path); } catch (e) { alert(`${f.name}: ${e.message}`); } } done(); }
function wireDrop(box, getTarget, done) {
  box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('drop'); });
  box.addEventListener('dragleave', () => box.classList.remove('drop'));
  box.addEventListener('drop', (e) => { e.preventDefault(); box.classList.remove('drop'); if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files], getTarget, done); });
  box.addEventListener('paste', (e) => { const fl = [...((e.clipboardData || {}).files || [])]; if (fl.length) { e.preventDefault(); addFiles(fl, getTarget, done); } });
}
$('#filePick').addEventListener('change', (e) => { const files = [...e.target.files]; e.target.value = ''; if (pickTarget) addFiles(files, pickTarget, pickDone); });
function chime(kind) {
  if (pref('sound', '0') !== '1') return;
  try {
    const ac = chime.ac || (chime.ac = new (window.AudioContext || window.webkitAudioContext)());
    (kind === 'warn' || kind === 'limit' ? [660, 440] : kind === 'question' ? [523, 784] : [587, 880]).forEach((hz, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * 0.16;
      o.frequency.value = hz; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
      o.start(t0); o.stop(t0 + 0.4);
    });
  } catch {}
}
function notify(kind, title, text, ticketId) {
  chime(kind);
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<b>${esc(title)}</b><span class="hint">${esc(short(text || '', 150))}</span>`;
  el.onclick = () => { if (ticketId && S.tickets[ticketId]) { S.job = ticketId; openApp('jobs'); } else if (kind === 'limit') openApp('usage'); el.remove(); };
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 12000);
  if (pref('notify', '0') === '1' && 'Notification' in window && Notification.permission === 'granted' && document.hidden) {
    try { const n = new Notification(title, { body: short(text || '', 200), tag: ticketId || kind, icon: '/icon.svg' }); n.onclick = () => { window.focus(); if (ticketId) { S.job = ticketId; openApp('jobs'); } }; } catch {}
  }
}
document.addEventListener('mousemove', (ev) => {
  const el = ev.target.closest && ev.target.closest('[data-tip]');
  const tip = $('#tip');
  if (!el) { tip.style.display = 'none'; return; }
  tip.textContent = el.dataset.tip; tip.style.display = 'block';
  tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, ev.clientX + 12) + 'px'; tip.style.top = (ev.clientY - 34) + 'px';
});

// ================================================================ launcher (Ctrl+K)
let palList = [], palSel = 0;
function palItems(q) {
  const items = APP_LIST.map((x) => ({ k: 'app', label: x.name, hint: `key ${x.key}`, run: () => openApp(x.id) }));
  for (const t of Object.values(S.tickets).sort((a, b) => b.createdAt - a.createdAt)) items.push({ k: 'job', label: `#${t.n} ${t.title}`, hint: stateLabel(t.status) + (t.archived ? ' · archived' : ''), run: () => { S.job = t.id; openApp('jobs'); } });
  for (const a of Object.values(S.agents)) items.push({ k: 'process', label: `${a.no || ''} ${a.persona} — ${a.id === S.root ? 'router' : a.name}`, hint: stateLabel(a.status), run: () => { S.sel = a.id; openApp('processes'); } });
  for (const k of leads()) {
    items.push({ k: 'action', label: `Weekly review — ${who(k)}`, hint: '', run: () => api('POST', `/api/agents/${k}/review`).then((r) => { if (r.id) { S.job = r.id; openApp('jobs'); } }) });
    items.push({ k: 'action', label: `Fresh session — ${who(k)}`, hint: 'saves memory first', run: () => api('POST', `/api/agents/${k}/refresh`) });
  }
  items.push({ k: 'action', label: 'Run self-test', hint: '', run: () => { openApp('health'); api('POST', '/api/selftest').catch((e) => alert(e.message)); } });
  items.push({ k: 'action', label: 'Keyboard shortcuts', hint: '?', run: showKeys });
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  return items.filter((it) => words.every((w) => (it.label + ' ' + it.k + ' ' + it.hint).toLowerCase().includes(w))).slice(0, 60);
}
function renderPal() {
  palList = palItems($('#palIn').value);
  palSel = Math.min(palSel, Math.max(0, palList.length - 1));
  $('#palItems').innerHTML = palList.map((it, i) => `<div class="it ${i === palSel ? 'on' : ''}" data-pi="${i}"><span class="k">${esc(it.k)}</span><span>${esc(short(it.label, 70))}</span><span class="hint">${esc(it.hint)}</span></div>`).join('') || '<div class="hint" style="padding:12px 16px">Nothing matches.</div>';
  const on = $('#palItems .it.on'); if (on) on.scrollIntoView({ block: 'nearest' });
}
function openPal() { $('#pal').classList.add('on'); $('#palIn').value = ''; palSel = 0; renderPal(); setTimeout(() => $('#palIn').focus(), 0); }
function closePal() { $('#pal').classList.remove('on'); }
function showKeys() {
  $('#pal').classList.add('on'); $('#palIn').value = '';
  $('#palItems').innerHTML = `<div style="padding:14px 18px;line-height:2">${[['Ctrl / ⌘ + K', 'launcher'], ['p · j · n · m · y · l · t · u · h · ,', 'open an app (see the dock)'], ['↑ ↓', 'move through processes or jobs'], ['← →', 'fold / unfold a process'], ['Enter', 'inspect'], ['Esc', 'close'], ['Ctrl + Enter', 'send'], ['?', 'this list']].map(([k, d]) => `<div><kbd>${k}</kbd> &nbsp; ${d}</div>`).join('')}</div>`;
  setTimeout(() => $('#palIn').focus(), 0);
}
$('#palIn').addEventListener('input', () => { palSel = 0; renderPal(); });
$('#palIn').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palList.length - 1, palSel + 1); renderPal(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); renderPal(); }
  else if (e.key === 'Enter') { e.preventDefault(); const it = palList[palSel]; closePal(); if (it) it.run(); }
  else if (e.key === 'Escape') { e.preventDefault(); closePal(); }
});
$('#pal').addEventListener('click', (e) => { const it = e.target.closest('[data-pi]'); if (it) { closePal(); palList[Number(it.dataset.pi)].run(); } else if (e.target.id === 'pal') closePal(); });
$('#quickIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.value.trim()) { S.quickText = e.target.value.trim(); e.target.value = ''; openApp('newjob'); } });

// ================================================================ keyboard
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#pal').classList.contains('on') ? closePal() : openPal(); return; }
  if (e.key === 'Escape') { if ($('#pal').classList.contains('on')) return closePal(); if (S.app === 'processes' && S.sel) { S.sel = null; writeHash(); return dirty(); } if (S.app === 'jobs' && S.job) { S.job = null; S.replay = null; writeHash(); return dirty(); } }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '?') { e.preventDefault(); return showKeys(); }
  const app = APP_LIST.find((x) => x.key === e.key.toLowerCase());
  if (app) { e.preventDefault(); return openApp(app.id); }
  if (S.app === 'processes' && ['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key)) {
    e.preventDefault();
    const rows = procRows();
    let i = rows.findIndex((r) => r.a.id === S.sel);
    if (e.key === 'ArrowDown') i = Math.min(rows.length - 1, i + 1);
    else if (e.key === 'ArrowUp') i = Math.max(0, i - 1);
    else if (e.key === 'ArrowLeft' && S.sel) S.collapsed.add(S.sel);
    else if (e.key === 'ArrowRight' && S.sel) S.collapsed.delete(S.sel);
    if (rows[i]) S.sel = rows[i].a.id;
    writeHash(); APPS.processes.update();
    const on = $('#psBody tr.on'); if (on) on.scrollIntoView({ block: 'nearest' });
  }
  if (S.app === 'jobs' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const ids = [...document.querySelectorAll('#jlist .jl')].map((x) => x.dataset.id);
    let i = ids.indexOf(S.job);
    i = e.key === 'ArrowDown' ? Math.min(ids.length - 1, i + 1) : Math.max(0, i - 1);
    if (ids[i]) { S.job = ids[i]; S.replay = null; writeHash(); APPS.jobs.update(); }
  }
});

  libTidy: () => api('POST', `/api/teams/${S.libTeam}/tidy`).then((r) => notify('answer', 'Library', r.message || 'Tidy-up queued.')).catch((e) => alert(e.message)),
  healthRefresh: () => { S.hKey = null; refreshHealth(); },
  selftest: () => { S.selftest = { status: 'running', steps: [], startedAt: Date.now() }; S.hKey = null; dirty(); api('POST', '/api/selftest').catch((e) => alert(e.message)); },
  saveRole: (d, ev) => api('POST', '/api/config/role', { key: d.key, team: d.team, model: $('#m_' + d.key).value || undefined, effort: $('#e_' + d.key).value || undefined, prompt: $('#p_' + d.key) ? $('#p_' + d.key).value : undefined }).then(() => { ev.target.textContent = 'Saved ✓'; setTimeout(() => { S.cfg = null; dirty(); }, 700); }).catch((e) => alert(e.message)),
  delRole: (d) => { if (confirm('Remove this role? Staff already hired keep working.')) api('DELETE', `/api/config/role/${d.key}`).then(() => { S.cfg = null; dirty(); }).catch((e) => alert(e.message)); },
  addRole: (d) => { const v = (n) => $(`#nr_${n}_${d.team}`).value; api('POST', '/api/config/role', { team: d.team, name: v('name'), access: v('access'), model: v('model'), effort: v('effort'), description: v('desc'), prompt: v('prompt') }).then(() => { S.cfg = null; dirty(); }).catch((e) => alert(e.message)); },
  addTeam: () => { const v = (n) => $('#nt_' + n).value; api('POST', '/api/config/team', { persona: v('persona'), room: v('room'), cwd: v('cwd'), access: v('access'), description: v('desc') }).then(() => { S.cfg = null; dirty(); }).catch((e) => alert(e.message)); },
  addProj: () => { S.cfg.projects.push({ name: '', path: '', department: S.cfg.residents.find((k) => k !== S.cfg.root), description: '' }); S.cfgKey = null; dirty(); },
  delProj: (d) => { S.cfg.projects.splice(Number(d.i), 1); S.cfgKey = null; dirty(); },
  saveProj: () => { const list = S.cfg.projects.map((p, i) => ({ ...p, name: $('#pj_name_' + i).value.trim(), path: $('#pj_path_' + i).value.trim(), department: $('#pj_dep_' + i).value, description: $('#pj_desc_' + i).value.trim(), leadEffort: $('#pj_eff_' + i).value || undefined, keywords: $('#pj_kw_' + i).value.split(',').map((x) => x.trim()).filter(Boolean) })).filter((p) => p.name && p.path); api('PUT', '/api/projects', list).then(async () => { const st = await api('GET', '/api/state'); S.projects = st.projects; S.cfg = null; dirty(); notify('answer', 'Projects saved', ''); }).catch((e) => alert(e.message)); },
};
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const f = ACT[el.dataset.act];
  if (!f) return;
  if (el.tagName !== 'INPUT') ev.preventDefault();
  try { const r = f(el.dataset, ev); if (r && r.catch) r.catch((e) => alert(e.message)); } catch (e) { alert(e.message); }
});

init().catch((e) => { document.body.innerHTML = `<div class="empty">Could not reach the Agentic OS server: ${esc(e.message)}. Start it with <code>./agentos</code>.</div>`; });
</script>
<script src="/ui/tokens-app.js"></script>
